name: CLCA self-validation

# This workflow validates CLCA itself and its synthetic sample application.
# It is intentionally NOT a trusted gate for the pull request that modifies it:
# PR-controlled source, catalog, policy, and command definitions are untrusted.
# Keep token permissions read-only and never publish a GitHub Check Run here.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clca-self-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-validation:
    name: Tests and synthetic pipeline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate benchmark manifest
        run: python benchmark/validate_manifest.py

      - name: Report planner-to-benchmark selection gaps
        run: python benchmark/compare_planner_to_manifest.py --output "$RUNNER_TEMP/clca-planner-alignment.json"

      - name: Run CLCA test suite
        run: python -m pytest -q tests

      - name: Prepare portable synthetic sample repository
        run: python scripts/prepare_sample_app.py

      - name: Test synthetic sample application
        working-directory: sample_app
        run: python -m pytest -q tests

      - name: Run CLI pipeline smoke test on synthetic repository
        run: |
          python -m clca.cli run \
            --repo sample_app \
            --base HEAD \
            --head HEAD \
            --catalog config/check_catalog.json \
            --policy config/policy.json \
            --commands config/commands.json \
            --budget-seconds 120 \
            --bundle-output sample_app/artifacts/ci-smoke.bundle.json \
            --output sample_app/artifacts/ci-smoke.decision.json \
            --report-output sample_app/artifacts/ci-smoke.report.md

      - name: Upload synthetic smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clca-self-validation-evidence
          path: |
            sample_app/artifacts/ci-smoke.*
            ${{ runner.temp }}/clca-planner-alignment.json
          retention-days: 7
          if-no-files-found: ignore
