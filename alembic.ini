[alembic]
# path to migration scripts
script_location = migrations

# database URL (overridden by CLCA_DATABASE_URL env var)
sqlalchemy.url = sqlite:///./clca.db

# version location
version_location = migrations/versions

# timezone to use when rendering the date
# within the migration file
# timezonename =

# max length of characters to apply to the version
# file name
# max_version_length = 32

# template used to generate migration file names
# file_template = %%(rev)s_%%(slug)s

# version code template
# version_code_template =

# separator between version and slug
# version_separator = _

# the naming style to use when applying migrations
# naming_style = underscore

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
