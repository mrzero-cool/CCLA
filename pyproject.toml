[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-layer-change-assurance"
version = "0.4.0"
description = "Evidence-backed cross-layer change verification MVP"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "networkx>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
clca = "clca.cli:main"
clca-service = "clca.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
